# pyproject.toml — project identity and the J dependency record (AGENTS.md: pins are part of J); depends on (none).
# Q31 admits only setuptools.build_meta.build_wheel at the exact cached 84.0.0 release.
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["broker", "cli", "compiler", "errors", "pager", "sources", "store", "trainer"]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "schema*"]
namespaces = true

[tool.setuptools.package-data]
schema = ["*.json", "campaign/*.json"]

[project]
name = "cassette"
version = "0.0.1"
description = "Frontier-class models on consumer Apple hardware from an external drive-resident cartridge."
license = { text = "Apache-2.0" }
# Product interpreter pin (macOS runners). env:any steps are additionally exercised on the
# sandbox interpreter (3.10); this pin is confirmed or revised, with recorded cause, at the
# first env:macos step (S06).
requires-python = "==3.13.*"
# Q1/Q51/Q57/Q62: blake3.blake3 is the one Cassette content and identity digest primitive.
# Q1/Q57: rfc8785.dumps is the one canonical model and manifest serializer.
# Q51: resumablesha256 exposes fixed SHA-256 continuation state; hashlib exposes no state.
# Q30: MLX 0.31.0 owns every dispatched Apple numerical operator; Cassette authors none.
# Q10/Q55: tokenizers.Tokenizer.from_str/encode/decode (Apache-2.0); no Hub or training APIs.
# Q10/Q55: Jinja2 ImmutableSandboxedEnvironment/StrictUndefined and AST inspection (BSD-3-Clause).
# Both exact pins serve L02 source semantics; unrepresentable templates/tokenizers fail explicitly.
dependencies = [
    "blake3==1.0.9",
    "mlx==0.31.0",
    "rfc8785==0.1.4",
    "resumablesha256==1.0",
    "tokenizers==0.23.2",
    "jinja2==3.1.6",
    # Q33/Q80: PyYAML safe_load of the authoritative matrix and execution queue (MIT).
    "pyyaml==6.0.3",
]

[project.scripts]
cassette = "cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
