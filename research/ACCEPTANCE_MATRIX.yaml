failure_rows:
  required: true
  expand_over_operations:
    - acquisition
    - compilation
    - inference_prefill
    - inference_decode
    - training
    - export
    - repair
    - removal
  injections:
    - process_death_at_every_durable_boundary
    - cartridge_disconnect
    - reconnect_same_identity
    - reconnect_wrong_identity
    - sleep_wake
    - bus_reset
    - port_migration
    - readonly_remount
    - insufficient_capacity_before_start
    - insufficient_capacity_during_candidate_write
    - corrupt_page
    - corrupt_index
    - corrupt_root
    - source_revision_change_during_transfer
    - invalid_gradient_nan_inf
    - cancellation
  phase_live_injections:
    - cartridge_disconnect
    - reconnect_same_identity
    - reconnect_wrong_identity
    - sleep_wake
    - bus_reset
    - port_migration
    - readonly_remount
    - insufficient_capacity_before_start
    - insufficient_capacity_during_candidate_write
    - source_revision_change_during_transfer
  approval_contract:
    exact_card_required_for_every_phase_live_coordinate: true
    physical_fault_card_required_for:
      - cartridge_disconnect
      - reconnect_same_identity
      - reconnect_wrong_identity
      - sleep_wake
      - bus_reset
      - port_migration
    bounded_path_specific_card_required_for:
      - readonly_remount
      - insufficient_capacity_before_start
      - insufficient_capacity_during_candidate_write
      - source_revision_change_during_transfer
    rule: >-
      a general campaign card never authorizes a physical fault, filler write, remount, or source
      mutation; an agent-executed action still requires an approved exact disk, path, byte or state
      bound, and stop conditions
  requalification_after_recovery:
    required_for:
      - cartridge_disconnect
      - reconnect_same_identity
      - reconnect_wrong_identity
      - sleep_wake
      - bus_reset
      - port_migration
      - readonly_remount
    not_applicable_for:
      - insufficient_capacity_before_start
      - insufficient_capacity_during_candidate_write
      - source_revision_change_during_transfer
    rule: >-
      the injection name alone determines graph shape before execution; every required coordinate
      contains REQUALIFY_START and REQUALIFY_VERIFY after RECOVER, while every not-applicable
      coordinate omits both records and may not resume through a changed physical path
  phase_live_operation_bindings:
    acquisition:
      subject: selected_F4_immutable_source
