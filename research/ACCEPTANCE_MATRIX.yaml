      - offline_adapter_dpo_1024_pairs
      - adapter_continued_pretraining_1048576_tokens
  - id: train_c1_s1_frontier_tier_b
    required: true
    execution_row: exec_c1_s1_frontier_compiled
    operations:
      - compiled_condition_atom_description_estimator_recovery_32768_traces
      - observation_and_composition_certificate_revalidation
      - every_precision_tier_recovery
  - id: train_c1_s1_scout_tier_a
    required: true
    execution_row: exec_c1_s1_scout_least_invasive
    operations:
      - adapter_sft_131072_tokens
      - offline_adapter_dpo_1024_pairs
      - adapter_continued_pretraining_1048576_tokens
  - id: train_c3_s3_frontier_tier_a
    required: true
    execution_row: exec_c3_s3_k3_compiled_portability
    operations:
      - adapter_sft_131072_tokens
      - offline_adapter_dpo_1024_pairs
      - adapter_continued_pretraining_1048576_tokens
  - id: train_c3_s3_frontier_tier_b
    required: true
    execution_row: exec_c3_s3_k3_compiled_portability
    operations:
      - compiled_condition_atom_description_estimator_recovery_32768_traces
      - observation_and_composition_certificate_revalidation
      - every_precision_tier_recovery
  - id: train_dense_fixture_tier_a
    required: true
    fixture_stage: F4
    operations:
      - adapter_sft_131072_tokens
      - offline_adapter_dpo_1024_pairs
      - adapter_continued_pretraining_1048576_tokens
    assertion: same_drive_resident_dataflow_and_commit_path_as_frontier_rows
  - id: train_dense_fixture_tier_b
    required: true
    fixture_stage: F4
    operations:
      - compiled_condition_atom_description_estimator_recovery_32768_traces
      - observation_and_composition_certificate_revalidation
      - every_precision_tier_recovery
    assertion: regenerated_q19_certificate_matches_clean_derivation_and_committed_child
  - id: train_sparse_fixture_tier_a
    required: true
    fixture_stage: F5
    operations:
      - adapter_sft_131072_tokens
      - offline_adapter_dpo_1024_pairs
      - adapter_continued_pretraining_1048576_tokens
    assertion: same_drive_resident_dataflow_and_commit_path_as_frontier_rows
  - id: train_sparse_fixture_tier_b
    required: true
    fixture_stage: F5
    operations:
      - compiled_condition_atom_description_estimator_recovery_32768_traces
      - observation_and_composition_certificate_revalidation
      - every_precision_tier_recovery
    assertion: regenerated_q19_certificate_matches_clean_derivation_and_committed_child

training_assertions:
  required_for_every_training_row:
    - q23_placement
    - q25_interrupt_resume
    - q28_write_meter
    - q53_capacity_reservation
    - q70_quality
    - q71_dataflow
    - q72_optimizer_equivalence
    - q73_atomic_child
    - q74_endurance_admission
    - resulting_revision_callable_through_all_agent_clients
    - tier_b_regenerates_every_invalidated_q19_witness_when_applicable
    - tier_b_incremental_certificate_matches_clean_derivation_when_applicable

failure_rows:
  required: true
  expand_over_operations:
    - acquisition
    - compilation
    - inference_prefill
    - inference_decode
    - training
    - export
    - repair
    - removal
  injections:
    - process_death_at_every_durable_boundary
    - cartridge_disconnect
    - reconnect_same_identity
    - reconnect_wrong_identity
    - sleep_wake
    - bus_reset
    - port_migration
    - readonly_remount
    - insufficient_capacity_before_start
    - insufficient_capacity_during_candidate_write
    - corrupt_page
    - corrupt_index
    - corrupt_root
    - source_revision_change_during_transfer
    - invalid_gradient_nan_inf
    - cancellation
  assertions:
    - no_partial_callable_revision
    - exact_typed_error
    - parent_or_exact_child_recovery
    - no_stale_handle_use
    - no_uncommitted_token
    - no_internal_model_file

offline_and_privacy_rows:
  - id: offline_inference_all_execution_rows
    required: true
    expand_over: execution_rows
    external_network: disabled
    allowed_network:
      - loopback_agent_protocol
    assertions:
      - no_remote_model_request
      - no_dns_or_external_socket
      - source_and_page_identity_verified
      - no_internal_full_checkpoint
      - prompt_and_output_persistence_matches_manifest
  - id: offline_training_all_training_rows
    required: true
    expand_over: training_rows
    external_network: disabled
    allowed_network:
      - loopback_agent_protocol
    assertions:
      - all_model_dataset_optimizer_checkpoint_and_journal_state_on_cartridge
      - no_remote_gradient_or_model_request
      - credential_isolation

minimum_code_rows:
  - id: q78_exact_accounting
    required: true
    assertions:
      - clean_build_reproduces_metric_J
      - no_new_general_numerical_kernel
      - no_duplicate_identity_or_transaction_authority
      - every_model_specific_variation_is_data_or_justified
      - every_remaining_original_component_has_removal_failure

falsified_claims:
  - id: former_exec_c3_s2_k3_native_parity
    date: 2026-08-05
    mechanism: NATIVE_SOURCE_ROUTING service parity on c3_ultra_512
    bound: >-
      139,431,402,496 active bytes per token / 819e9 B/s = 170.2 ms per token, a 5.87 tok/s
      ceiling at 100% utilization, below the Q68 10 tok/s floor
    evidence: E-011
    disposition: row reclassified TEACHER_CORRECTNESS per Q38/Q39 reopen machinery; boundary not lowered

forbidden_completion_evidence:
  - paper
  - literature_review
  - simulator_only
  - benchmark_harness_only
  - diagnostic_fixture_below_F6
  - small_model_only
  - personal_device_anecdote
  - human_facing_demonstration
  - remote_inference_substitution
  - manually_overridden_status
  - suppressed_honesty_vector_component

result:
  status: NOT_RUN
  completion_digest: null
  evidence_bundle: null
