    gate_tier: FRONTIER_CLASS
    gates:
      - q68_usability_floors
      - q68_value_gate_vs_b_native_c1
      - q68_position_gate_vs_b_teacher
      - q18_capacity_proof
      - q19_mathematical_certificate
      - q68_honesty_vector_published
    required_context_tests:
      - ordinary
      - 131072_tokens
    training_tiers:
      - A
      - B
  - id: exec_c1_scout_least_invasive
