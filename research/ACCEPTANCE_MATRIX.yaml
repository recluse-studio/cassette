result:
  status: NOT_RUN
  completion_digest: null
  evidence_bundle: null

status_contract:
  row_statuses:
    NOT_RUN: no qualifying execution has begun
    RUNNING: a durable background operation is active and has no terminal result
    PASS: every declared assertion passed at its required evidence level
    FAIL: an executed assertion failed, including a gate or row with a Q38_FALSIFIED outcome
    BLOCKED: an authority, approval, account, hardware, environment, or prerequisite is unavailable
  q38_rule: Q38_FALSIFIED is an outcome attached to FAIL; it never satisfies a PASS dependency
  queue_statuses: [TODO, IN_PROGRESS, DONE, BLOCKED]
  campaign_result_statuses:
    NOT_RUN: no qualifying live campaign execution has begun
    RUNNING: at least one durable campaign operation is active and no terminal required-row failure exists
    INCOMPLETE: qualifying live work began, no campaign operation is active, and required work remains without a terminal failure or campaign-wide blocker
    FAIL: at least one executed required row failed, including Q38_FALSIFIED
    BLOCKED: no eligible path toward completion remains because a required authority, approval, account, hardware, environment, or prerequisite is unavailable
    PASS: Q80 clean-root replay proved every required row at LIVE evidence and issued the completion digest
  campaign_bundle_rule: every executed INCOMPLETE, FAIL, BLOCKED, or PASS result names a sealed campaign evidence bundle; NOT_RUN may retain null
  completion_rule: only result.status PASS may carry a completion digest
