    role: CONSUMER_GENERAL
    apple_class: c1_air_32
    storage_profile_family: external_apfs_measured
    operation_plan_profile_digest: required_at_run
    model: llama_4_scout
    mode: LEAST_INVASIVE_PASSING_Q40_MODE
    allowed_q40_modes: [1, 2, 3]
    on_no_passing_mode: FAIL_ROW_WITH_Q38_RECORD
    gate_tier: floors_plus_q17_parity_tier
    required_context_tests:
      - ordinary
      - declared_maximum
    training_tiers:
      - A
  - id: exec_c2_qwen_least_invasive
    required: true
    role: CONSUMER_PRO
    apple_class: c2_max_128
    storage_profile_family: external_apfs_measured
    operation_plan_profile_digest: required_at_run
    model: qwen3_235b_a22b
    mode: LEAST_INVASIVE_PASSING_Q40_MODE
    allowed_q40_modes: [1, 2, 3]
    on_no_passing_mode: FAIL_ROW_WITH_Q38_RECORD
    gate_tier: floors_plus_q17_parity_tier
    required_context_tests:
      - ordinary
      - declared_maximum
    training_tiers: []
  - id: exec_c3_k3_native_teacher
    required: true
    role: TEACHER_CORRECTNESS
    apple_class: c3_ultra_512
    storage_profile_family: external_apfs_measured
    operation_plan_profile_digest: required_at_run
    model: kimi_k3
    mode: NATIVE_SOURCE_ROUTING
    gate_tier: correctness_and_honest_reporting_only
    falsified_parity_claim: E-011
    duties:
      - native_routing_correctness
      - declared_capability_correctness_including_1048576_context
      - teacher_trace_generation_for_compilation
      - absolute_service_report
    forbidden_labels:
      - FRONTIER_CLASS
      - PARITY
      - NEAR_LABORATORY
    required_context_tests:
      - ordinary
      - 131072_tokens
      - 1048576_tokens
    training_tiers: []
  - id: exec_c3_k3_compiled_portability
    required: true
    role: PORTABILITY_AND_TRAINING
    apple_class: c3_ultra_512
    storage_profile_family: external_apfs_measured
    operation_plan_profile_digest: required_at_run
    model: kimi_k3
    mode: COMPILED_CERTIFIED
    precondition: f5_gate PASS
    mathematical_certificate: Q19 required and independently recomputed
    gate_tier: q68_usability_floors_plus_portability
    gates:
      - q19_mathematical_certificate
      - q18_capacity_proof
    portability_assertions:
      - same_cartridge_pages_as_c1_row_no_weight_duplication (Q11, Q59)
    required_context_tests:
      - ordinary
      - 131072_tokens
      - 1048576_tokens
    training_tiers:
      - A
      - B

workload_suites:
  - id: capability_complete_q16
    required: true
    expand_over: execution_rows
    cases:
      - ordinary_warm
      - ordinary_cold
      - reasoning
      - coding_with_executable_tests
      - tool_round_trip
      - structured_output_schema
      - multi_turn_state
      - declared_context_boundaries
      - declared_modalities
      - cancellation
      - recovery
    assertions:
      - q10_semantics
      - q17_quality_at_row_tier
      - q18_long_tail_at_row_tier
      - q19_compiled_compatibility_and_execution_resource_when_compiled
      - q68_gate_tier_service
      - q69_tail_latency
  - id: sustained_q48
    required: true
    expand_over: execution_rows
    minimum_minutes: 120
    minimum_generated_tokens: 20000
    assertions:
      - every_post_warmup_window_passes_row_gate_tier
      - throughput_decay_at_most_10_percent
      - no_integrity_error

