schema_version: 5
matrix_id: cassette-first-complete-release
scope_mode: GENERAL_PRODUCT
initial_status: NOT_RUN
amended: 2026-09-02
remit_authority: ../ORIGINAL_REMIT.md (amended 2026-09-02)
mathematical_authority: ../MATHS.md (cutover after S11, before S12)
thesis: >-
  Frontier-class capability on consumer Apple hardware: the cartridge carries the parameter mass,
  the consumer machine does the work it was built to do. Release gates measure the machine against
  its own unaided ceiling (B_native) and the model's own reference (B_teacher); the laboratory gap
  is measured and published, never gated.

completion_rule:
  contract: Q80
  required_status: PASS
  forbidden_terminal_substitutes:
    - NOT_RUN
    - BLOCKED
    - SKIPPED
    - SUBSTITUTED
    - SIMULATED
    - REMOTE
    - FAIL
  require_live_evidence: true
  require_one_reproducible_completion_digest: true
  expression: >-
    every required expanded row is PASS and LIVE_PROVEN under its declared gate tier
    (FRONTIER_CLASS for thesis rows, floors plus Q17 PARITY tier for mild-transform rows,
    correctness for TEACHER_CORRECTNESS rows), every compiled row carries one independently
    recomputable Q19 certificate, the F4 and F5 gates passed before any frontier compiled row ran,
    Q78 exact accounting is PASS, Q79 offline proof is PASS, and no required
    row used a remote model at runtime or a personal-device anecdote

threshold_contracts:
  quality: Q17 (tiered)
  long_tail_and_capacity: Q18 (tiered)
  compiled_compatibility_and_execution_resource: Q19
  thermal: Q48
  service_gates: Q68 (floors / FRONTIER_CLASS / PARITY)
  tails: Q69
  training: Q70

baselines:
  b_teacher_per_model:
    contract: Q13
    definition: the model's own full-capacity reference execution (hosted or declared server class)
    manifest: required_at_freeze
  b_hosted_per_model:
    contract: Q13
    definition: laboratory service where an equivalent one exists; Q67 field statuses recorded
    manifest: required_at_freeze_or_marked_non_equivalent
  b_native_c1:
    contract: Q13 selection rule over NativeSet(c1_air_32)
    definition: strongest openly downloadable model executing natively within c1 with no cartridge
    pinned: required_at_freeze
  b_native_c2:
    contract: Q13 selection rule over NativeSet(c2_max_128)
    definition: strongest openly downloadable model executing natively within c2 with no cartridge
    pinned: required_at_freeze

baseline_freeze:
  status: NOT_RUN
  required_before: any_teacher_trace_capture_or_Q17_Q18_Q68_comparison
  source_revision: required_full_commit_and_tree_digest
  dependency_lock_digest: required
  matrix_digest: required
  runbook_digest: required
  q78_pre_live_checkpoint: required_PASS
  model_rule: >-
    freeze each model's B_teacher and B_hosted manifest only after that immutable model revision is
    pinned; freeze B_native_c1 and B_native_c2 from their complete recorded NativeSet candidate lists;
    an unavailable or materially hidden hosted field is recorded NON_EQUIVALENT, never omitted
  assertions:
    - every_applicable_baseline_has_one_immutable_manifest_before_comparison_data_exists
    - b_native_selection_reproduces_from_the_frozen_candidate_set
    - a_non_equivalent_hosted_baseline_cannot_enter_a_ratio_or_parity_gate
    - changing_one_material_baseline_field_changes_its_identity

compute_provenance:
  runtime_inference_and_training: apple_hardware_plus_cartridge_only
  frontier_compilation: >-
    external compute permitted once per transform, recorded completely in the open reproducible
    transform manifest; the resulting cartridge verifies by identity like any acquired artifact
    (remit ruling 2026-08-05)

phase_machine_deferral:
  phases:
    - L01.25
    - L01.5
    - L02
    - L03
    - L04
    - L05
  outcome: CONTRACT_AMENDMENT_REQUIRES_L01_25_MACHINE_PROOF
  machine_baseline_claim: PHASE_MACHINE_BASELINE_CONTRACT_AMENDMENT_PENDING
  live_evidence: NOT_RUN
  prohibited_evidence:
    - F4_PASS
    - F5_PASS
    - frontier_capability
    - hosted_comparison
    - physical_drive_performance

