storage_profile_families:
  external_apfs_measured:
    role: OPERATION_BOUND
    filesystem: APFS
    attachment: locally_attached_macos
    capacity_admission: Q53_next_atomic_transition
    profile_contract: Q41-Q44
    operation_plan_profile_digest: required_at_run
    endurance_profile_digest: required_when_operation_writes_training_state
    writable_training: operation_qualified
    descriptive_labels_not_admission_gates:
      - media
      - storage_class
      - connector
      - brand
      - advertised_speed
      - nominal_capacity

adaptive_capacity_control:
  contract: Q53
  machine_proof_phase: L01.25
  principal_presence: not_required
  status: NOT_RUN
  evidence_level: FIXTURE
  required_assertions:
    - next_atomic_transition_only
    - no_fixed_device_fraction_byte_floor_user_ceiling_or_whole_job_reservation
    - feasible_next_step_starts_without_whole_campaign_fit
    - concurrent_cassette_claims_do_not_overcommit
    - capacity_remeasured_before_each_write_and_after_each_durable_boundary
    - active_claim_transaction_and_journal_objects_survive_reclamation
    - retained_root_pinned_rollback_and_user_owned_objects_survive_reclamation
    - only_eligible_cassette_owned_temporary_or_reproducible_objects_are_reclaimed
    - external_free_space_reduction_or_enospc_recovers_parent_or_committed_child
    - newly_available_capacity_resumes_from_same_committed_boundary

storage_eligibility_control:
  contract: Q39-Q44
  machine_proof_phase: L01.25
  principal_presence: not_required
  status: NOT_RUN
  evidence_level: FIXTURE
  required_assertions:
    - no_storage_media_class_connector_or_nominal_capacity_admission_gate
    - any_locally_attached_macos_apfs_drive_may_attempt_measurement
    - descriptive_labels_do_not_determine_admission

physical_storage_qualification:
  contract: Q39-Q44
  live_proof_phase: L01.5
  principal_presence: required
  status: NOT_RUN
  required_assertions:
    - coarse_top_level_protected_content_inventory_created_off_drive_before_first_write
    - inventory_records_top_level_name_type_aggregate_logical_bytes_and_identity_only
    - inventory_detects_broad_size_change_not_content_integrity
    - writes_confined_to_approved_campaign_root
    - exact_drive_operation_plan_profile_recorded
    - every_physical_drive_used_by_a_required_row_has_its_own_exact_drive_operation_plan_profile_before_that_operation_begins
    - optional_reference_profiles_do_not_gate_qualification
    - no_live_source_or_model_byte_before_L02
  qualification_cardinality: >-
    one record per exact physical drive, assembled path, Apple host, operation, and plan; a missing
    record blocks only that operation, and a failed tuple does not make the drive ineligible for a
    different measured operation
  phase_gate_semantics:
    source_entry_pass: >-
      after L01.25, inventory and campaign-root proof plus the exact header, acquisition, and Ollama
      physical profiles pass before L02 makes any live source request or moves any model byte
    later_profiles: >-
      compile, inference, training, execution, failure, export, repair, and removal profiles retain
      the L01.5 label but gate only their exact consumer; they do not postpone or redefine the
      source-entry L01.5 PASS gate

