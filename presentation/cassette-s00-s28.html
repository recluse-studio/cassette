    const slides = document.getElementById("slides");
    const counter = document.getElementById("counter");
    let current = 0;

    function brand() {
      return '<span class="brand-mark" aria-hidden="true"></span><span>Recluse Studio / Cassette</span>';
    }

    function spiderSprite() {
      return `<span class="spider-sprite" aria-hidden="true">
        <i class="spider-leg spider-leg--1"></i><i class="spider-leg spider-leg--2"></i><i class="spider-leg spider-leg--3"></i><i class="spider-leg spider-leg--4"></i>
        <i class="spider-leg spider-leg--5"></i><i class="spider-leg spider-leg--6"></i><i class="spider-leg spider-leg--7"></i><i class="spider-leg spider-leg--8"></i>
        <i class="spider-body"></i><i class="spider-eye"></i>
      </span>`;
    }

    function platformerZone(step) {
      if (step === 0) return "cartridge map";
      if (step <= 10) return "foundations";
      if (step <= 15) return "working window";
      if (step <= 18) return "many callers";
      if (step <= 22) return "representation + training";
      return "proof";
    }

    function platformerProgress(currentStep, currentStage) {
      const total = stageData.length;
      const step = Math.max(0, Math.min(currentStep, total));
      const progress = total ? step / total : 0;
      const playerLeft = 4 + progress * 92;
      const tiles = stageData.map((stage, index) => {
        const tileStep = index + 1;
        const classes = [`platformer-tile`, `platformer-tile--${stage.status}`];
        if (tileStep < step) classes.push("is-past");
        if (tileStep === step) classes.push("is-current");
        return `<span class="${classes.join(" ")}" title="${stage.id}"></span>`;
      }).join("");
      const mapLabel = step === 0 ? "prologue" : currentStage;
      const statusLabel = step === 0 ? "before the first room" : `${currentStage} / ${stageData[step - 1]?.status === "done" ? "built" : stageData[step - 1]?.status === "foundation" ? "foundation" : "still to build"}`;
      return `<div class="platformer-progress" role="img" aria-label="Platformer progress map. Current ${mapLabel}. Green rooms are built, red rooms remain to be built, and the spider marks the slide currently being read."><div class="platformer-progress__head"><span>World 0 / ${platformerZone(step)}</span><span>${statusLabel}</span></div><div class="platformer-track"><div class="platformer-track__tiles">${tiles}</div><span class="platformer-player" style="left: ${playerLeft.toFixed(2)}%"></span><span class="platformer-flag" aria-hidden="true"></span></div><div class="platformer-progress__legend"><span class="legend-done"><i></i>built</span><span class="legend-open"><i></i>still to build</span><span class="legend-current"><i></i>current slide</span></div></div>`;
    }

    function node(code, title, detail, modifier = "") {
      return `<div class="node ${modifier}"><span class="node-code">${code}</span><strong>${title}</strong><small>${detail}</small></div>`;
    }

    function arrow() { return '<span class="arrow" aria-hidden="true">→</span>'; }

    function diagramMarkup(type) {
      switch (type) {
        case "route":
          return `<div class="title-route">
            <div class="flow-row route-row">
              ${node("01", "Source", "downloadable model", "node--orange")}${arrow()}
              ${node("02", "Cartridge", "complete authority", "node--green")}${arrow()}
              ${node("03", "Apple", "bounded working set", "node--blue")}${arrow()}
              ${node("04", "Agent", "local operation", "node--cream")}
            </div>
            <div class="route-note"><div>All model and training state stays on the external cartridge.</div><div>The Mac holds only the bytes this request can afford.</div></div>
          </div>`;
        case "guardrail":
          return `<div class="two-column-diagram">
            <div class="diagram-panel"><h3>Counts as Cassette</h3><ul class="diagram-list"><li>The complete model remains on the external cartridge.</li><li>Apple hardware runs the work locally.</li><li>Unified memory holds a bounded working set.</li><li>The final claim is tested against the full matrix.</li></ul></div>

        case "ledger":
          return `<div class="ledger-diagram"><div class="diagram-panel"><h3>The promise</h3><ul class="diagram-list"><li>One authored runtime.</li><li>One owner for each rule.</li><li>No hidden duplicate machinery.</li></ul></div>${arrow()}<div><div class="ledger-lines"><div class="ledger-line"><span>authored code</span><strong>counted</strong></div><div class="ledger-line"><span>dependencies</span><strong>pinned</strong></div><div class="ledger-line"><span>processes</span><strong>counted</strong></div><div class="ledger-line"><span>binary bytes</span><strong>reported</strong></div></div><div class="ledger-total">clean checkout<br>reproduces the report</div></div></div>`;

        case "identity":

        case "pages":
          return `<div><div class="page-strip"><span class="page page--one"></span><span class="page page--one"></span><span class="page page--two page--cross"></span><span class="page page--two"></span><span class="page page--one"></span><span class="page page--one"></span><span class="page page--two"></span><span class="page page--two"></span><span class="page page--one"></span><span class="page page--one"></span></div><div class="page-labels"><span>one tensor crosses a page boundary</span><span>TensorMap remembers the spans</span></div><div class="repack-row"><div class="layout-card"><strong>layout A</strong><div class="page-strip"><span class="page page--one"></span><span class="page page--two"></span><span class="page page--one"></span><span class="page page--two"></span><span class="page page--one"></span><span class="page page--two"></span></div><span class="layout-note">same logical tensor</span></div>${arrow()}<div class="layout-card"><strong>layout B / repacked</strong><div class="page-strip"><span class="page page--two"></span><span class="page page--one"></span><span class="page page--two"></span><span class="page page--one"></span><span class="page page--two"></span><span class="page page--one"></span></div><span class="layout-note">same bytes, new positions</span></div></div></div>`;
        case "transaction":

          return `<div class="epoch-layout"><div class="epoch epoch--verified"><strong>mount A</strong><span>UUID + filesystem + root agree</span><span>token A is valid</span></div>${arrow()}<div class="epoch epoch--dead"><strong>disconnect</strong><span>token A is invalidated</span><span>no stale read is attempted</span></div>${arrow()}<div class="epoch epoch--verified"><strong>mount B</strong><span>identity is checked again</span><span>token B is newly issued</span></div></div>`;
        case "sources":
          return `<div class="source-stack"><div class="node node--compact node--orange"><strong>Hugging Face</strong><small>its own wire</small></div><div class="node node--compact node--blue"><strong>Ollama</strong><small>its own wire</small></div><div class="node node--compact node--green"><strong>Tinker</strong><small>its own wire</small></div>${arrow()}<div class="adapter-card"><strong>one adapter boundary</strong><div class="adapter-ops"><span>resolve</span><span>enumerate</span><span>read facts</span><span>open range</span><span>translate auth/license</span></div></div>${arrow()}<div class="node node--wide node--cream"><strong>shared transfer engine</strong><small>one lifecycle, one journal</small></div></div>`;
        case "transfer":
          return `<div><div class="progress-strip">${Array.from({length: 12}, (_, i) => `<span class="progress-cell ${i < 6 ? "progress-cell--done" : i === 6 ? "progress-cell--bad" : i === 7 ? "progress-cell--active" : ""}"></span>`).join("")}</div><div class="transfer-note"><span>completed ranges stay recorded</span><span>bad / missing range resumes here</span></div><div class="decision-bar"><span class="tag tag--good">full coverage</span><span class="tag tag--good">source digest matches</span><span class="tag tag--bad">otherwise: no commit</span></div></div>`;
        case "decision":
          return `<div class="decision-layout"><div class="preflight-card"><span class="node-code">READ BEFORE DOWNLOAD</span><div class="checklist"><div class="check-line"><span>model facts</span><strong>present</strong></div><div class="check-line"><span>required math</span><strong>known</strong></div><div class="check-line"><span>license evidence</span><strong>clear</strong></div><div class="check-line"><span>memory / capacity</span><strong>fits?</strong></div></div></div>${arrow()}<div class="decision-mark"><span>one<br>decision</span></div>${arrow()}<div class="outcome-grid"><div class="outcome outcome--green">supported now</div><div class="outcome outcome--blue">prepare first</div><div class="outcome outcome--orange">not enough evidence</div><div class="outcome outcome--red">unsupported</div></div></div>`;
        case "dispatch":
          return `<div><div class="dispatch-layout"><div class="operator-list"><div class="operator">operator: attention</div><div class="operator">shape: 4096 × 4096</div><div class="operator">type: float16</div></div>${arrow()}<div class="dispatch-table"><div class="dispatch-row"><span>generated map</span><strong>MLX op A</strong></div><div class="dispatch-row"><span>golden tensor</span><strong>matches</strong></div><div class="dispatch-row"><span>runtime owner</span><strong>pager / trainer</strong></div></div>${arrow()}<div class="node node--wide node--green"><strong>pinned MLX</strong><small>one numerical path</small></div></div><div class="blocked-branch">blocked route: “if model family = X, use a private kernel”</div></div>`;
        case "memory":
          return `<div class="memory-diagram"><div class="memory-ceiling"><span>hard memory ceiling</span></div><div class="memory-row"><strong>working pages</strong>${[1,2,3,4,5,6].map(i => `<span class="memory-cell ${i === 2 || i === 3 ? "memory-cell--active" : i === 4 ? "memory-cell--full" : ""}"></span>`).join("")}</div><div class="memory-row"><strong>cache</strong>${[1,2,3,4,5,6].map(i => `<span class="memory-cell ${i > 3 ? "memory-cell--context" : ""}"></span>`).join("")}</div><div class="memory-row"><strong>context + activations</strong>${[1,2,3,4,5,6].map(i => `<span class="memory-cell ${i > 4 ? "memory-cell--context" : ""}"></span>`).join("")}</div><div class="memory-row"><strong>reserve</strong>${[1,2,3,4,5,6].map(() => '<span class="memory-cell memory-cell--reserve"></span>').join("")}</div><div class="decision-bar"><span class="tag tag--blue">full model remains on cartridge</span><span class="tag tag--bad">over ceiling → reject before allocation</span></div></div>`;
        case "miss":
          return `<div><div class="miss-layout"><div class="miss-step">request<br>page</div>${arrow()}<div class="miss-step miss-step--accent">page<br>miss</div>${arrow()}<div class="miss-step">fetch +<br>verify</div>${arrow()}<div class="miss-step">make<br>room</div>${arrow()}<div class="miss-step miss-step--good">admit<br>page</div></div><div class="miss-failure"><div>timeout / cancel → typed stop</div><div>corrupt bytes → reject before use</div></div></div>`;
        case "tiny":
          return `<div><div class="tiny-loop"><div class="node node--compact node--orange"><strong>prompt</strong><small>request page</small></div>${arrow()}<div class="node node--compact node--blue"><strong>cartridge</strong><small>verified page</small></div>${arrow()}<div class="node node--compact node--green"><strong>MLX</strong><small>bounded window</small></div>${arrow()}<div class="node node--compact node--cream"><strong>token</strong><small>visible result</small></div></div><div class="rollback"><span>forced miss</span>${arrow()}<strong>rollback KV cache</strong>${arrow()}<span>same visible result</span></div></div>`;
        case "broker":
          return `<div class="broker-layout"><div class="broker-lines"><div class="broker-line"><span>acquisition</span><strong>state</strong></div><div class="broker-line"><span>inference</span><strong>state</strong></div><div class="broker-line"><span>training</span><strong>state</strong></div><div class="broker-line"><span>export</span><strong>state</strong></div></div><div class="broker-card"><strong>canonical broker</strong><div class="broker-lines"><div class="broker-line"><span>cancel</span><strong>owned here</strong></div><div class="broker-line"><span>retry</span><strong>owned here</strong></div><div class="broker-line"><span>replay</span><strong>idempotent</strong></div></div></div><div class="event-log"><div>01 / admitted</div><div>02 / page requested</div><div>03 / page verified</div><div>04 / operation resumed</div></div></div>`;
        case "queue":
          return `<div class="queue-layout"><div class="client-stack"><div class="client-card"><strong>client A</strong><span>waiting for the working set</span></div><div class="client-card"><strong>client B</strong><span>waiting behind A</span></div></div>${arrow()}<div><div class="lease-card"><strong>lease A</strong><span>capacity checked before admission</span></div><div class="stale-note">handoff → A’s cached work is invalidated</div></div>${arrow()}<div class="machine-card"><strong>one bounded window</strong><span>one current owner</span></div></div>`;
        case "clients":
          return `<div class="clients-layout"><div class="client-grid"><div class="client-tile">Codex<br><small>edge adapter</small></div><div class="client-tile">Ollama<br><small>edge adapter</small></div><div class="client-tile">OpenClaw<br><small>edge adapter</small></div><div class="client-tile">Hermes / custom<br><small>edge adapter</small></div></div><div class="trace-loop"><strong>canonical trace</strong><div class="flow-column"><span class="tag">client request</span>${arrow()}<span class="tag tag--good">broker operation</span>${arrow()}<span class="tag">client response</span></div><div class="stale-note">unsupported capability → honest rejection</div></div></div>`;
        case "compiler":
          return `<div><div class="compiler-layout"><div class="contribution-list"><div class="contribution">source A <span>mapped</span></div><div class="contribution">source B <span>mapped</span></div><div class="contribution">source C <span>mapped</span></div><div class="contribution">source D <span>mapped</span></div><div class="contribution">source E <span>mapped</span></div><div class="contribution">source F <span>mapped</span></div></div><div class="compiler-lines">→<br>→<br>→</div><div class="compiled-list"><div class="compiled-item">compiled page 1 <span>kept</span></div><div class="compiled-item">compiled page 2 <span>merged</span></div><div class="compiled-item">compiled page 3 <span>quantized</span></div><div class="compiled-item">compiled page 4 <span>selected</span></div></div></div><div class="compiler-warning">No source row without a destination. Omission is a structural failure.</div></div>`;
        case "invalidation":
          return `<div class="invalidation-layout"><div class="change-list"><div class="change-item">hardware class changes</div><div class="change-item">source revision changes</div><div class="change-item">quality rule changes</div></div>${arrow()}<div class="plan-list"><div class="plan-item plan-item--invalid">hardware plan → invalidated by hardware change</div><div class="plan-item">access plan → remains valid</div><div class="plan-item">quality plan → remains valid</div></div><div class="no-payload">plans point to the model; they do not copy the model</div></div>`;
        case "trainer":
          return `<div class="trainer-layout"><div class="storage-column"><div class="storage-block">base model<br><small>cartridge</small></div><div class="storage-block">optimizer state<br><small>cartridge</small></div></div>${arrow()}<div class="window-column"><div class="window-block">one dependency window<br><small>unified memory</small></div><div class="window-block">forward + backward<br><small>bounded work</small></div></div>${arrow()}<div class="child-column"><div class="child-block">updated deltas<br><small>cartridge</small></div><div class="child-block">child revision<br><small>durable commit</small></div></div></div>`;
        case "meter":
          return `<div class="meter-layout"><div class="meter-request"><strong>training request</strong><div class="meter-lines"><div class="meter-line"><span>operation</span><strong>bounded adapter</strong></div><div class="meter-line"><span>estimated work</span><strong>declared</strong></div><div class="meter-line"><span>mutation</span><strong>not yet</strong></div></div></div><div><div class="gauge-grid"><div class="gauge"><span>free space</span><i></i></div><div class="gauge"><span>memory</span><i></i></div><div class="gauge"><span>bandwidth</span><i></i></div><div class="gauge"><span>endurance</span><i></i></div><div class="gauge"><span>power / heat</span><i></i></div><div class="gauge"><span>time</span><i></i></div></div><div class="decision-bar"><span class="tag tag--good">admit if all fit</span><span class="tag tag--bad">stop at a named boundary if reality drifts</span></div></div></div>`;
        case "matrix":
          return `<div class="matrix-layout"><div class="matrix-grid"><div class="matrix-cell matrix-cell--header">operation</div><div class="matrix-cell matrix-cell--header">interrupt</div><div class="matrix-cell matrix-cell--header">corrupt</div><div class="matrix-cell matrix-cell--header">timeout</div><div class="matrix-cell matrix-cell--header">cancel</div><div class="matrix-cell matrix-cell--header">disconnect</div><div class="matrix-cell matrix-cell--header">acquire</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--live">live</div><div class="matrix-cell matrix-cell--header">compile</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--live">live</div><div class="matrix-cell matrix-cell--header">inference</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--live">live</div><div class="matrix-cell matrix-cell--header">training</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--good">test</div><div class="matrix-cell matrix-cell--live">live</div></div><div class="matrix-legend"><span class="tag tag--good">generated test</span><span class="tag tag--blue">hardware campaign</span><span class="tag tag--warn">from contract data</span></div></div>`;
        case "teacher":
          return `<div class="teacher-layout"><div class="teacher-card"><strong>teacher run / 3–8B model</strong><div class="trace-lines"><span></span><span></span><span></span><span></span></div><small>requests · active contributions · time · quality</small></div>${arrow()}<div class="trace-card"><strong>digest-locked trace corpus</strong><div class="trace-lines"><span></span><span></span><span></span><span></span></div><small>one model / one workload / named evidence</small></div></div>`;
        case "simulator":
          return `<div class="curve-layout"><div class="trace-card"><strong>recorded trace</strong><div class="trace-lines"><span></span><span></span><span></span><span></span></div></div>${arrow()}<div class="curve-card"><strong>compiler + replay</strong><div class="curve-lines"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div></div>${arrow()}<div class="curve-card"><strong>storage profiles</strong><div class="curve-lines"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><small>bytes · stability · quality</small></div></div>`;
        case "gate":
          return `<div><div class="gate-layout"><div class="gate"><strong>BYTES</strong>touch no more than 25% of ordinary active bytes</div><div class="gate"><strong>STABILITY</strong>behavior remains stable under the declared test</div><div class="gate"><strong>QUALITY</strong>stays inside the confidence and training budget</div></div><div class="gate-results"><div class="gate-result gate-result--pass">PASS<br><small>mechanism earns the next question</small></div><div class="gate-result gate-result--false">Q38-FALSIFIED<br><small>mechanism closes with a recorded failure</small></div></div></div>`;
        case "accounting":
          return `<div class="accounting-layout"><div class="repo-tree"><strong>repository tree</strong><div class="tree-line">store.py / one authority</div><div class="tree-line">pager.py / one authority</div><div class="tree-line">tests / cited proof</div><div class="tree-line">tools / accounting</div></div>${arrow()}<div><div class="accounting-report"><strong>accounting report</strong><div class="report-line">code / dependencies / processes</div><div class="report-line">runtimes / branches / bytes</div></div><div class="removal-report"><strong>removal map</strong><div class="report-line">orphaned helper → remove</div><div class="report-line">missing row → defect</div></div></div></div>`;
        case "closeout":
          return `<div class="closeout-layout"><div class="machine-column"><div class="phase-label">machine phase / S01–S28</div><div class="phase-step phase-step--done">S01–S09 / built</div><div class="phase-step phase-step--todo">S10–S27 / still to build</div><div class="phase-step phase-step--todo">S28 / closeout record</div></div><div class="closeout-gate">closeout<br>requires<br>all steps<br>resolved</div><div class="live-column"><div class="phase-label">live campaign / L01–L05</div><div class="phase-step phase-step--live">real storage qualification</div><div class="phase-step phase-step--live">live source acquisition</div><div class="phase-step phase-step--live">larger-model gates</div><div class="phase-step phase-step--live">complete Q80 run</div></div></div>`;
        default:
          return "";
      }
    }

    function titleSlide() {
      return `<section class="slide slide--title is-active" data-stage="TITLE" data-accent="red" aria-labelledby="title-heading"><div class="slide-inner"><header class="topbar"><div class="brand-lockup">${brand()}</div>${platformerProgress(0, "PROLOGUE")}<div class="slide-meta"><span>recovered cartridge / 30</span><span class="status status--foundation">fictional frame</span></div></header><div class="title-layout"><div class="copy title-copy"><div class="title-spider-note">${spiderSprite()}<div><span class="eyebrow">Recovered field manual / unreleased platformer</span><strong>The game never shipped.</strong></div></div><h1 id="title-heading">The Spider<br>in<br>Cartridge 0</h1><p class="lead">There was never a finished game. The real problem behind the fictional cartridge is Cassette: can a very large language model stay useful on a person’s Mac when its complete set of weights lives on an external drive?</p><p>The fiction gives the machine a level map. The build order is real: identity, storage, recovery, memory, execution, clients, training, and proof. This deck follows S00 through S28 until the finished product can show its work.</p><p class="title-quote">The full model stays on the cartridge. The Mac supplies the working window.</p></div><div class="diagram-frame" role="img" aria-label="The Cassette path from source to external cartridge to Apple working memory to agent"><div class="diagram-head"><span class="diagram-title">The missing game’s real map</span><span class="diagram-kicker">source → cartridge → working window → agent</span></div><div class="diagram-body">${diagramMarkup("route")}<div class="diagram-caption">Green rooms are built, red rooms are still ahead, and the spider marks the slide you are reading. The handoffs remain the subject: every stage gives the next one a smaller, clearer promise.</div></div></div></div><footer class="slide-footer"><span class="next">← / → move through the recovered cartridge · O opens the stage map</span><span class="source">Cassette truth: S01–S09 built · S10–S28 still to build</span></footer></div></section>`;
    }

    function stageSlide(stage, index) {
      const statusLabel = stage.status === "done" ? "Built" : stage.status === "todo" ? "Still to build" : "Starting contract";
      return `<section class="slide" data-stage="${stage.id}" data-accent="${stage.accent}" aria-labelledby="${stage.id.toLowerCase()}-heading"><div class="slide-inner"><header class="topbar"><div class="brand-lockup">${brand()}</div>${platformerProgress(index + 1, stage.id)}<div class="slide-meta"><span>${stage.id} / recovered stage log</span><span class="status status--${stage.status}">${statusLabel}</span></div></header><div class="stage-layout"><div class="copy"><div class="eyebrow">${stage.id} · ${stage.group}</div><h1 id="${stage.id.toLowerCase()}-heading">${stage.title}</h1><p class="lead">${stage.lead}</p><p>${stage.body}</p><div class="plain-box"><div class="plain-label">In plain English</div><p class="plain-copy">${stage.plain}</p></div><div class="fact-row"><div class="fact"><span class="label">Before</span><strong>${stage.before}</strong></div><div class="fact"><span class="label">This stage adds</span><strong>${stage.adds}</strong></div><div class="fact"><span class="label">After</span><strong>${stage.after}</strong></div></div><p class="proof-note">Contract / evidence: ${stage.proof}</p></div><div class="diagram-frame" role="img" aria-label="${stage.diagramAlt}"><div class="diagram-head"><span class="diagram-title">${stage.diagramTitle}</span><span class="diagram-kicker">${stage.diagramKicker}</span></div><div class="diagram-body">${diagramMarkup(stage.diagram)}<div class="diagram-caption">The map shows the spider's position in the sequence. The drawing is the claim: it shows what enters this stage, what changes here, and what the next stage is allowed to assume.</div></div></div></div><footer class="slide-footer"><span class="next">${stage.next}</span><span class="source">cartridge log ${String(index + 2).padStart(2, "0")} / 30</span></footer></div></section>`;
    }

    function render() {
      slides.innerHTML = titleSlide() + stageData.map(stageSlide).join("");
    }

    function setSlide(next) {
      const all = [...document.querySelectorAll(".slide")];
      current = Math.max(0, Math.min(next, all.length - 1));
      all.forEach((slide, index) => {
        slide.classList.toggle("is-active", index === current);
        slide.setAttribute("aria-hidden", index === current ? "false" : "true");
      });
      counter.textContent = `${String(current + 1).padStart(2, "0")} / ${all.length}`;
      if (!document.body.classList.contains("is-overview")) window.scrollTo({top: 0, behavior: "instant"});
    }

    function toggleOverview() {
      document.body.classList.toggle("is-overview");
      if (!document.body.classList.contains("is-overview")) setSlide(current);
    }

    render();
    setSlide(0);
    document.getElementById("previous").addEventListener("click", () => setSlide(current - 1));
    document.getElementById("next").addEventListener("click", () => setSlide(current + 1));
    document.getElementById("overview").addEventListener("click", toggleOverview);
    document.addEventListener("keydown", event => {
      if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;
      if (event.key === "ArrowRight" || event.key === "PageDown" || event.key === " ") { event.preventDefault(); setSlide(current + 1); }
      if (event.key === "ArrowLeft" || event.key === "PageUp") { event.preventDefault(); setSlide(current - 1); }
      if (event.key === "Home") { event.preventDefault(); setSlide(0); }
      if (event.key === "End") { event.preventDefault(); setSlide(document.querySelectorAll(".slide").length - 1); }
      if (event.key.toLowerCase() === "o") { event.preventDefault(); toggleOverview(); }
    });
  </script>
</body>
</html>
